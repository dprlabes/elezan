<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Elezan</title>
    <meta name="description" content="Daniel Elezan @elezanes Painter, illustrator and designer">
    
    <!-- Favicon de la web -->
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- Importación de la tipografía Inter Tight -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300;0,480;0,700;1,300;1,480;1,700&display=swap" rel="stylesheet">

    <style>
        /* 1. RESET Y CONFIGURACIÓN GLOBAL */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent; /* Elimina el destello o subrayado azul al tocar en móviles */
        }

        body {
            width: 100%;
            min-height: 100vh;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            transition: background-image 1s ease-in-out;
            font-family: "Inter Tight", sans-serif;
        }

        #content {
            width: 100%;
            min-height: 100vh;
        }

        /* 2. MENÚ CENTRADO FLEXBOX */
        .menu-container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .art-menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
        }

        /* 3. ESTRUCTURA DE BOTONES Y ANIMACIONES SIN SOLAPAMIENTO */
        .hover-effect {
            position: relative;
            display: inline-block;
            text-align: center;
            text-decoration: none;
        }

        .button-img {
            display: block;
            height: auto;
            max-width: 100%;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: auto;
            transition: none;
        }

        /* Al pasar el ratón, la imagen base se apaga por completo */
        .hover-effect:hover img.button-img:not(.top) {
            opacity: 0;
        }

        .hover-effect img.top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: none;
            pointer-events: none;
        }

        /* Al pasar el ratón, la imagen subrayada aparece */
        .hover-effect:hover img.top {
            opacity: 1;
        }

        /* 4. ANCHOS MÁXIMOS PARA JERARQUÍA EN ESCRITORIO */
        .btn-art { max-width: 563px; }
        .btn-commercial { max-width: 784px; }
        .btn-contact { max-width: 444px; }
        .btn-info { max-width: 202px; }

        /* 5. DISEÑO RESPONSIVE */
        @media (max-width: 1024px) {
            .art-menu { gap: 16px; }
            .btn-art { max-width: 60vw; }
            .btn-commercial { max-width: 78vw; }
            .btn-contact { max-width: 52vw; }
            .btn-info { max-width: min(26vw, 202px); }
        }

        @media (max-width: 640px) {
            .menu-container { padding: 15px; }
            .art-menu { gap: 14px; }
            .btn-art { max-width: 80vw; }
            .btn-commercial { max-width: 92vw; }
            .btn-contact { max-width: 65vw; }
            .btn-info { max-width: min(35vw, 202px); }
        }
    </style>
</head>

<body>

    <div id="content">
        <main class="menu-container">
            <nav class="art-menu">
                
                <!-- ART WORKS -->
                <a class="hover-effect" href="artworks.html">
                    <img alt="Art Works" class="button-img btn-art" src="index/artworks.webp" loading="lazy" />
                    <img alt="Art Works Hover" class="button-img top btn-art" src="index/artworks-s.webp" />
                </a>

                <!-- COMMERCIAL WORKS -->
                <a class="hover-effect" href="commercialworks.html">
                    <img alt="Commercial Works" class="button-img btn-commercial" src="index/comercialworks.webp" loading="lazy" />
                    <img alt="Commercial Works Hover" class="button-img top btn-commercial" src="index/comercialworks-s.webp" />
                </a>

                <!-- CONTACT -->
                <a class="hover-effect" href="contact.html">
                    <img alt="Contact" class="button-img btn-contact" src="index/contact.webp" loading="lazy" />
                    <img alt="Contact Hover" class="button-img top btn-contact" src="index/contact-s.webp" />
                </a>

                <!-- INFO -->
                <a class="hover-effect" href="info.html">
                    <img alt="Info" class="button-img btn-info" src="index/info.webp" loading="lazy" />
                    <img alt="Info Hover" class="button-img top btn-info" src="index/info-s.webp" />
                </a>

            </nav>
        </main>
    </div>

    <!-- SCRIPT DE CAMBIO DE FONDO DINÁMICO Y ALEATORIO -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const backgrounds = ['index/index1.webp', 'index/index2.webp'];
            
            // Elegimos una imagen aleatoria para empezar al cargar la página
            let currentIndex = Math.floor(Math.random() * backgrounds.length);

            function changeBackground() {
                document.body.style.backgroundImage = `url('${backgrounds[currentIndex]}')`;
                // Pasamos a la siguiente de forma cíclica (y seguirá alternando cada 10 segundos)
                currentIndex = (currentIndex + 1) % backgrounds.length;
            }

            // Aplicamos el fondo aleatorio inicial de inmediato
            changeBackground();

            // Configuramos el intervalo para que siga rotando cada 10 segundos
            setInterval(changeBackground, 10000);
        });
    </script>

</body>
</html>
