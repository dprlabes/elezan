<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Elezan</title>
    <meta name="description" content="Daniel Elezan @elezanes Painter, illustrator and designer">
    
    <!-- Favicon de la web (dentro de la carpeta index) -->
    <link rel="icon" type="image/png" href="index/favicon.png">

    <!-- Precarga de los fondos para transiciones instantáneas -->
    <link rel="preload" as="image" href="index/index1.jpg">
    <link rel="preload" as="image" href="index/index2.jpg">

    <style>
        /* 1. RESET Y CONFIGURACIÓN GLOBAL */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100%;
            min-height: 100vh;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            transition: background-image 1s ease-in-out;
        }

        /* 2. CONTROL DE CARGA INICIAL */
        .hidden {
            opacity: 0;
            visibility: hidden;
        }

        #content {
            opacity: 1;
            visibility: visible;
            width: 100%;
            min-height: 100vh;
            transition: opacity 0.5s ease-in-out;
        }

        /* 3. MENÚ CENTRADO FLEXBOX */
        .menu-container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .art-menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
        }

        /* 4. ESTRUCTURA DE BOTONES Y CAMBIO LIMPIO */
        .hover-effect {
            position: relative;
            display: inline-block;
            text-align: center;
            text-decoration: none;
        }

        .button-img {
            display: block;
            width: auto;
            height: auto;
            max-width: 100%;
            transition: none;
        }

        /* Al pasar el ratón, la imagen base se apaga por completo */
        .hover-effect:hover .button-img:not(.top) {
            opacity: 0;
        }

        /* La imagen superior se coloca encima milimétricamente */
        .hover-effect img.top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: none;
            pointer-events: none;
        }

        /* Al pasar el ratón, la imagen superior se enciende por completo */
        .hover-effect:hover img.top {
            opacity: 1;
        }

        /* 5. ESPACIADO RESPONSIVE */
        @media (max-width: 600px) {
            .menu-container { padding: 15px; }
            .art-menu { gap: 14px; }
        }
    </style>
</head>

<body>

    <!-- Contenedor principal oculto hasta que carguen las imágenes y fondos -->
    <div class="hidden" id="content">
        
        <main class="menu-container">
            <nav class="art-menu">
                
                <!-- ART WORKS -->
                <a class="hover-effect" href="artworks.html">
                    <img alt="Art Works" class="button-img" src="index/artworks.webp" />
                    <img alt="Art Works Hover" class="button-img top" src="index/artworks-s.webp" />
                </a>

                <!-- COMMERCIAL WORKS -->
                <a class="hover-effect" href="commercial.html">
                    <img alt="Commercial Works" class="button-img" src="index/comercialworks.webp" />
                    <img alt="Commercial Works Hover" class="button-img top" src="index/comercialworks-s.webp" />
                </a>

                <!-- CONTACT -->
                <a class="hover-effect" href="contact.html">
                    <img alt="Contact" class="button-img" src="index/contact.webp" />
                    <img alt="Contact Hover" class="button-img top" src="index/contact-s.webp" />
                </a>

                <!-- INFO -->
                <a class="hover-effect" href="info.html">
                    <img alt="Info" class="button-img" src="index/info.webp" />
                    <img alt="Info Hover" class="button-img top" src="index/info-s.webp" />
                </a>

            </nav>
        </main>

    </div>

    <!-- Script de control: Precarga de recursos WebP y rotación de fondos -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const menuImages = Array.from(document.images).map(img => img.src);
            const backgrounds = ['index/index1.jpg', 'index/index2.jpg'];
            const allSources = [...menuImages, ...backgrounds];
            
            let loadedCount = 0;
            const totalAssets = allSources.length;

            function assetLoaded() {
                loadedCount++;
                if (loadedCount >= totalAssets) {
                    document.getElementById('content').classList.remove('hidden');
                }
            }

            if (totalAssets === 0) {
                document.getElementById('content').classList.remove('hidden');
            } else {
                allSources.forEach(src => {
                    const tempImg = new Image();
                    tempImg.src = src;
                    tempImg.onload = assetLoaded;
                    tempImg.onerror = assetLoaded;
                });
            }

            // Cambiar fondo aleatoriamente cada 10 segundos
            let currentIndex = Math.floor(Math.random() * backgrounds.length);

            function changeBackground() {
                document.body.style.backgroundImage = `url('${backgrounds[currentIndex]}')`;
                currentIndex = (currentIndex + 1) % backgrounds.length;
            }

            changeBackground();
            setInterval(changeBackground, 10000);
        });
    </script>

</body>
</html>
