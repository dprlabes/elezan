<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elezan - Commercial Works</title>
    <meta name="description" content="Daniel Elezan @elezanes Painter, illustrator and designer">
    
    <!-- Favicon de la web -->
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- Importación de la tipografía Inter Tight -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300;0,480;0,700;1,300;1,480;1,700&display=swap" rel="stylesheet">

    <style>
        /* 1. RESET Y CONFIGURACIÓN GLOBAL */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body.commercialworks-page {
            width: 100%;
            min-height: 100vh;
            background-image: url('commercialworks/fondotierra.gif');
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            font-family: "Inter Tight", sans-serif;
        }

        #content {
            width: 100%;
            min-height: 100vh;
        }

        .commercialworks-wrapper {
            width: 100%;
            max-width: 1080px;
            margin: 0 auto;
            padding: 40px 15px;
        }

        /* 2. GALERÍA PRINCIPAL */
        .commercialworks-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            width: 100%;
            align-items: flex-start;
        }

        .grid-item {
            flex: 1 1 calc(33.333% - 1.34px);
            max-width: calc(33.333% - 1.34px);
            cursor: pointer;
            overflow: visible !important;
            display: block;
        }

        .grid-item img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.2s ease;
            position: relative;
            z-index: 1;
        }

        .grid-item:hover img {
            transform: scale(1.02);
            z-index: 5;
        }

        /* 3. MODAL / CARRUSEL FLOTANTE */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: none;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-container {
            position: relative;
            width: auto;
            max-width: 95vw;
            height: auto;
            max-height: 95vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .modal-content-box {
            display: flex;
            flex-direction: column;
            width: auto;
            height: auto;
            max-width: 95vw;
            max-height: 95vh;
            background: transparent;
        }

        .modal-img-container {
            width: 100%;
            height: auto;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            cursor: grab;
            overflow: hidden;
            position: relative;
            touch-action: pan-y;
        }

        .modal-img-container:active {
            cursor: grabbing;
        }

        .carousel-track {
            display: flex;
            height: 100%;
            will-change: transform;
        }

        .carousel-slide {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            user-select: none;
            height: auto;
        }

        .carousel-slide img {
            max-width: min(1080px, 95vw);
            max-height: calc(95vh - 40px);
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
            user-select: none;
            pointer-events: auto;
            -webkit-user-drag: none;
        }

        .modal-info-bar {
            width: 100%;
            background: #ffffff;
            color: #000000;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            box-sizing: border-box;
            z-index: 10;
        }

        .modal-desc {
            font-weight: 480;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-right: 10px;
        }

        .download-link {
            color: #000;
            text-decoration: underline;
            font-weight: 500;
            font-size: 10px;
            margin-left: 15px;
            white-space: nowrap;
        }

        .modal-nav-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
            width: 100%;
            background: none;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            border: 1.5px solid #000000;
            background: transparent;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .dot.active {
            background: #000000;
        }

        .dot:hover {
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .grid-item {
                flex: 1 1 calc(33.333% - 4px);
                max-width: calc(33.333% - 4px);
            }
            .commercialworks-grid {
                gap: 6px;
            }
            .modal-info-bar {
                padding: 6px 10px;
                font-size: 11px;
            }
        }
    </style>
</head>

<body class="commercialworks-page">

    <div id="content">
        <main class="commercialworks-wrapper">
            <div class="commercialworks-grid" id="galleryGrid">
                <!-- Portadas generadas dinámicamente -->
            </div>
        </main>
    </div>

    <!-- ESTRUCTURA DEL MODAL CARRUSEL -->
    <div class="modal" id="carouselModal">
        <div class="modal-container" id="modalContainer">
            <div class="modal-content-box" id="modalContentBox">
                <div class="modal-img-container" id="modalImgContainer">
                    <div class="carousel-track" id="carouselTrack">
                        <!-- Las diapositivas se generan dinámicamente -->
                    </div>
                </div>

                <div class="modal-info-bar" id="modalInfoBar">
                    <span class="modal-desc" id="modalDesc">Detalle</span>
                    <a href="#" target="_blank" rel="noopener noreferrer" id="downloadBtn" class="download-link">Open</a>
                </div>
            </div>

            <div class="modal-nav-bar" id="modalNavBar">
                <!-- Se generan automáticamente según el nº de fotos -->
            </div>
        </div>
    </div>

    <script>
        const projects = [
            {
                title: "sdfhsdfh",
                images: ["dr.jpg", "qerqr.jpg", "evy0.jpg"]
            },
            {
                title: "sfhsdhs",
                images: ["we273.jpg"]
            },
            {
                title: "sfshehr",
                images: ["20g.jpg", "f7gq3.jpg"]
            },
            {
                title: "dfsherh3",
                images: ["d9y.jpg"]
            },
            {
                title: "sgheherhe",
                images: ["wef.jpg", "c23wgre.jpg"]
            },
            {
                title: "wbvererb",
                images: ["qe8vt.jpg", "v3dv.jpg"]
            }
        ];

        let currentProjectIndex = 0;
        let currentImageIndex = 0;
        let virtualIndex = 1;
        let isTransitioning = false;
        let isMenuOpen = false; // Candado permanente para el clic derecho

        const transitionDuration = 480; // ms

        const galleryGrid = document.getElementById('galleryGrid');
        const modal = document.getElementById('carouselModal');
        const modalContentBox = document.getElementById('modalContentBox');
        const modalImgContainer = document.getElementById('modalImgContainer');
        const carouselTrack = document.getElementById('carouselTrack');
        const modalInfoBar = document.getElementById('modalInfoBar');
        const modalDesc = document.getElementById('modalDesc');
        const downloadBtn = document.getElementById('downloadBtn');
        const modalNavBar = document.getElementById('modalNavBar');

        // Renderizar galería principal
        projects.forEach((proj, pIndex) => {
            const coverImg = proj.images[0];
            const item = document.createElement('div');
            item.className = 'grid-item';
            item.innerHTML = `<img src="commercialworks/${coverImg}" alt="${proj.title}" loading="lazy">`;
            item.onclick = () => openCarousel(pIndex, 0);
            galleryGrid.appendChild(item);
        });

        function openCarousel(projIdx, imgIdx) {
            currentProjectIndex = projIdx;
            currentImageIndex = imgIdx;
            isMenuOpen = false;
            
            buildSlides();
            buildDots();
            
            carouselTrack.style.transition = 'none';
            carouselTrack.style.transform = 'translateX(0px)';

            const currentProj = projects[currentProjectIndex];
            virtualIndex = currentProj.images.length > 1 ? currentImageIndex + 1 : 0;

            updateLayout(false);
            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
            isDragging = false;
            hasMoved = false;
            isMenuOpen = false;

            setTimeout(() => {
                carouselTrack.style.transition = 'none';
                carouselTrack.style.transform = 'translateX(0px)';
                carouselTrack.innerHTML = '';
            }, 200);
        }

        function createSlideElement(imgName) {
            const slide = document.createElement('div');
            slide.className = 'carousel-slide';
            const img = document.createElement('img');
            img.src = `commercialworks/${imgName}`;
            img.alt = "Artwork Large";
            
            // Activamos el candado permanente al abrir el menú contextual
            img.addEventListener('contextmenu', (e) => {
                e.stopPropagation();
                isMenuOpen = true;
            });

            // Si el menú estaba abierto, el primer clic izquierdo solo lo cierra y frena el avance
            img.addEventListener('click', (e) => {
                if (isMenuOpen) {
                    e.stopPropagation();
                    isMenuOpen = false; // Desactivamos el candado para el siguiente clic normal
                } else {
                    nextImage(true);
                }
            });

            img.onload = () => {
                updateSlideDimensions();
                updateLayout(false);
            };

            slide.appendChild(img);
            return slide;
        }

        function buildSlides() {
            carouselTrack.innerHTML = '';
            const currentProj = projects[currentProjectIndex];
            const imgs = currentProj.images;

            if (imgs.length > 1) {
                carouselTrack.appendChild(createSlideElement(imgs[imgs.length - 1]));
                imgs.forEach(imgName => carouselTrack.appendChild(createSlideElement(imgName)));
                carouselTrack.appendChild(createSlideElement(imgs[0]));
            } else {
                imgs.forEach(imgName => carouselTrack.appendChild(createSlideElement(imgName)));
            }
        }

        function updateSlideDimensions() {
            const slides = carouselTrack.querySelectorAll('.carousel-slide');
            slides.forEach(slide => {
                const img = slide.querySelector('img');
                if (img && img.getBoundingClientRect().width > 0) {
                    const w = img.getBoundingClientRect().width;
                    const h = img.getBoundingClientRect().height;
                    slide.style.width = w + 'px';
                    slide.style.height = h + 'px';
                }
            });
        }

        function buildDots() {
            modalNavBar.innerHTML = '';
            const currentProj = projects[currentProjectIndex];
            
            if (currentProj.images.length <= 1) {
                modalNavBar.style.display = 'none';
                return;
            } else {
                modalNavBar.style.display = 'flex';
            }

            currentProj.images.forEach((_, idx) => {
                const dot = document.createElement('span');
                dot.className = `dot ${idx === currentImageIndex ? 'active' : ''}`;
                dot.onclick = (e) => {
                    e.stopPropagation();
                    if (isTransitioning) return;
                    currentImageIndex = idx;
                    virtualIndex = idx + 1;
                    updateLayout(true);
                };
                modalNavBar.appendChild(dot);
            });
        }

        function updateLayout(animate = true) {
            updateSlideDimensions();
            const slides = carouselTrack.querySelectorAll('.carousel-slide');
            if (slides.length === 0 || !slides[virtualIndex]) return;

            const activeSlide = slides[virtualIndex];
            const activeImg = activeSlide.querySelector('img');
            if (!activeImg) return;

            const imgWidth = activeImg.getBoundingClientRect().width;
            const imgHeight = activeImg.getBoundingClientRect().height;

            if (imgWidth > 0 && imgHeight > 0) {
                modalImgContainer.style.width = imgWidth + 'px';
                modalImgContainer.style.height = imgHeight + 'px';
                modalContentBox.style.width = imgWidth + 'px';

                let targetX = 0;
                for (let i = 0; i < virtualIndex; i++) {
                    const prevImg = slides[i].querySelector('img');
                    targetX += prevImg ? prevImg.getBoundingClientRect().width : imgWidth;
                }

                if (animate) {
                    carouselTrack.style.transition = `transform ${transitionDuration}ms cubic-bezier(0.25, 1, 0.5, 1)`;
                } else {
                    carouselTrack.style.transition = 'none';
                }
                carouselTrack.style.transform = `translateX(-${targetX}px)`;
            }

            const currentProj = projects[currentProjectIndex];
            const imgSrc = `commercialworks/${currentProj.images[currentImageIndex]}`;
            modalDesc.textContent = currentProj.title;
            downloadBtn.href = imgSrc;

            updateDotsUI();
        }

        function updateDotsUI() {
            const dots = modalNavBar.querySelectorAll('.dot');
            dots.forEach((dot, idx) => {
                if (idx === currentImageIndex) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
        }

        function nextImage(animate = true) {
            const currentProj = projects[currentProjectIndex];
            const imgs = currentProj.images;
            if (imgs.length <= 1 || isTransitioning) return;

            isTransitioning = true;
            virtualIndex++;
            currentImageIndex = (currentImageIndex + 1) % imgs.length;

            updateLayout(animate);

            if (virtualIndex === imgs.length + 1) {
                setTimeout(() => {
                    virtualIndex = 1;
                    updateLayout(false);
                    isTransitioning = false;
                }, transitionDuration);
            } else {
                setTimeout(() => { isTransitioning = false; }, transitionDuration);
            }
        }

        function prevImage(animate = true) {
            const currentProj = projects[currentProjectIndex];
            const imgs = currentProj.images;
            if (imgs.length <= 1 || isTransitioning) return;

            isTransitioning = true;
            virtualIndex--;
            currentImageIndex = (currentImageIndex - 1 + imgs.length) % imgs.length;

            updateLayout(animate);

            if (virtualIndex === 0) {
                setTimeout(() => {
                    virtualIndex = imgs.length;
                    updateLayout(false);
                    isTransitioning = false;
                }, transitionDuration);
            } else {
                setTimeout(() => { isTransitioning = false; }, transitionDuration);
            }
        }

        window.addEventListener('resize', () => {
            if (modal.classList.contains('active')) {
                updateLayout(false);
            }
        });

        // CONTROL DE ARRASTRE DE RATÓN
        let startX = 0;
        let startY = 0;
        let currentTranslateX = 0;
        let isDragging = false;
        let hasMoved = false;

        modalImgContainer.addEventListener('mousedown', (e) => {
            if (e.button !== 0 || isTransitioning) return;

            isDragging = true;
            hasMoved = false;
            startX = e.clientX;
            startY = e.clientY;

            const slides = carouselTrack.querySelectorAll('.carousel-slide');
            currentTranslateX = 0;
            for (let i = 0; i < virtualIndex; i++) {
                const img = slides[i].querySelector('img');
                currentTranslateX += img ? img.getBoundingClientRect().width : 0;
            }

            carouselTrack.style.transition = 'none';
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const diffX = e.clientX - startX;
            const diffY = e.clientY - startY;
            
            if (Math.abs(diffX) > 6 || Math.abs(diffY) > 6) {
                hasMoved = true;
                carouselTrack.style.transform = `translateX(${-currentTranslateX + diffX}px)`;
            }
        });

        window.addEventListener('mouseup', (e) => {
            if (!isDragging) return;
            isDragging = false;

            const slides = carouselTrack.querySelectorAll('.carousel-slide');
            if (slides.length === 0 || !hasMoved) return;

            const activeImg = slides[virtualIndex].querySelector('img');
            const slideWidth = activeImg ? activeImg.getBoundingClientRect().width : 300;
            const diffX = e.clientX - startX;

            if (diffX < -slideWidth * 0.15) {
                nextImage(true);
            } else if (diffX > slideWidth * 0.15) {
                prevImage(true);
            } else {
                updateLayout(true);
            }
        });

        modal.onclick = (e) => {
            if (e.target === modal) {
                closeModal();
            }
        };

        // EVENTOS DE TECLADO
        document.addEventListener('keydown', (e) => {
            if (!modal.classList.contains('active')) return;
            if (e.key === 'ArrowRight') {
                e.preventDefault();
                nextImage(true);
            }
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevImage(true);
            }
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
